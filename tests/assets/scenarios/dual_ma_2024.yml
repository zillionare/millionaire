name: dual_ma_2024
status:
  backtest: ready
  paper: ready
  live: ready

goal: Prove the minimal 000001.SZ dual-MA accuracy contract on fixed 2024 market data.

assets_manifest: tests/assets/manifest.yml
scenario_slice: dual_ma_2024_demo

strategy:
  module: quantide/strategies/example/dual_ma.py
  class: DualMAStrategy
  symbol: 000001.SZ
  params:
    fast: 5
    slow: 10
    invest: 100000
    initial_cash: 200000
    commission: 0.0005

execution:
  trigger_time: '09:30:00'
  visible_data_rule: Previous trading day and earlier daily bars only.
  match_rule: Market order matched at the next trading day open.
  buy_quantity_rule: floor(invest / (up_limit * (1 + commission)) / 100) * 100
  sell_rule: Sell all available shares on death cross.
  slippage: 0.0
  force_liquidation_at_end: false

data_files:
  market:
    - tests/assets/2024_bars_ext_cols.parquet
    - tests/assets/baseline_calendar.parquet
  supporting:
    - tests/assets/2024_adjust_factor.parquet
    - tests/assets/2024_limit_price.parquet
    - tests/assets/2024_st_info.parquet

baselines:
  backtest: tests/assets/baselines/dual_ma_2024.backtest.json
  paper: tests/assets/baselines/dual_ma_2024.paper.json
  live: tests/assets/baselines/dual_ma_2024.live.json

oracle:
  command: .venv/bin/python scripts/demo_e2e_accuracy_contract.py
  source: scripts/demo_e2e_accuracy_contract.py

acceptance:
  trade_count: 14
  ending_total: 203259.114
  total_return: 0.016296
  cagr: 0.042888
  sharpe_ratio: 0.478634
  max_drawdown: -0.054554

notes:
  - Backtest and paper now share the same verified trade facts on the fixed 2024 replay slice.
  - The backtest baseline is generated by the independent demo ledger, not by BacktestRunner.
  - Live baseline now anchors strategy-path full fill, partial-fill cancel, reject, replay/reconnect, and qtoid mapping-break block cases through the local gateway stub.