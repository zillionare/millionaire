[tool]

[tool.poetry]
name = "millionaire-ce"
version = "0.3.0"
homepage = "https://github.com/zillionare/millionaire-ce"
description = "Millionaire Community Edition quantitative trading platform."
authors = ["Aaron Yang <aaron_yang@jieyu.ai>"]
readme = "README.md"
license = "MIT"
classifiers=[
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.13'
]

packages = [
    { include = "quantide" },
]

# Tests, notebooks, coverage output, and repository-only engineering notes are
# useful in the source tree but are not part of the CE release artifacts. In
# particular, this prevents old private risk IDs in historical tests from
# entering an sdist while keeping those tests available to repository users.
exclude = [
    "tests/**",
    "notebooks/**",
    "htmlcov/**",
    ".dev/**",
    ".louke/**",
    "review/**",
    "quality-reports/**",
    "data/**",
    "dist/**",
    "site/**",
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"

apscheduler = "^3.10.4"
arrow = "^1.3.0"
python-fasthtml = "^0.12.36"
bcrypt = "^5.0.0"
loguru = "^0.7.3"
aiosmtplib = "^5.0.0"
bidict = "^0.23.1"
tenacity = "^9.1.2"
sqlite-utils = "^3.39"
polars = "^1.36.1"
polars-talib = "^0.1.5"
empyrical-reloaded = "^0.5.12"  # v0.2 评估指标第三方库 (empyrical 已停维, 用 reloaded fork)
pandas = "^2.3.3"
pyarrow = "^22.0.0"
monsterui = "^1.0.36"
cffi = ">=1.17.1"
msgpack = "^1.1.2"
tushare = "^1.4.25"
# Tushare imports six at package import time but does not declare it.
six = "^1.17.0"
filelock = ">=3.20.0,<5.0"
httpx = "^0.28.1"
websockets = "^15.0.1"
uvicorn = "^0.41.0"
starlette = ">=0.40,<1.0"
lightgbm = { version = "^4.6.0", optional = true }
baostock = "^0.9.4"
scikit-learn = { version = "^1.7.0", optional = true }

[tool.poetry.extras]
ml30m = ["lightgbm", "scikit-learn"]

[tool.poetry.scripts]
millionaire-ce = "quantide.cli:main"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
cache-dir = "/tmp/millionaire-ce/ruff-cache"
line-length = 100
target-version = "py313"
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".history",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".venv-wheel",
    "_build",
    "buck-out",
    "build",
    "dist",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D400",
    "D415",
    "D213",
    "F403",
    "F405",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["B007", "B018", "D200", "D205", "D402", "E402", "F811", "F821", "UP031"]
"tests/**/*.py" = ["E501"]

# Same tool split as tracks: Ruff owns line width, Flake8 CCR001 owns
# cognitive complexity, and Pylint owns duplication and structural budgets.
[tool.pylint.messages_control]
disable = "all"
enable = "R0801,C0302,R0915,R0914"

[tool.pylint.format]
max-module-lines = 1000

[tool.pylint.similarities]
min-similarity-lines = 5
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.design]
max-statements = 50
max-locals = 15

[tool.pytest.ini_options]
cache_dir = "/tmp/millionaire-ce/pytest-cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live_data and not private_only and not e2e_live_smoke'"
markers = [
    "live_data: real market-data source checks; periodic and release-only, uses TUSHARE_TOKEN",
    "e2e: HTTP-level end-to-end tests organized by user journey",
    "release_gate: QA release-gate evidence tracked in the three-mode acceptance checklist",
    "e2e_paper: L1 paper E2E (test-plan §5.3, §6.3.1) — 默认 CI 跑 (虚拟时钟 + 公共 support)",
    "e2e_gateway: L2 网关契约仿真 E2E (test-plan §5.3, §6.3.2) — 默认 CI 跑 (假网关 + 公共 support)",
    "e2e_live_smoke: L3 实盘路径冒烟 E2E (test-plan §5.3, §6.3.3) — **默认 deselect**, 仅在 Windows+QMT 真机环境跑",
    "private_only: private-edition contract; run only with an explicit zillionaire edition override",
]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pandas-stubs==2.3.3.260113",
    "pyarrow-stubs==20.0.0.20251215",
    "types-PyYAML==6.0.12.20261103",
    "ruff==0.16.0",
    "tox (>=3.24.5,<4.0.0)",
    "pre-commit==4.3.0",
    "twine (>=3.8.0,<4.0.0)",
    "html2image (>=2.0.7,<3.0.0)",
]

test = [
    "freezegun (>=1.5.5,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)",
    "pytest-socket==0.7.0",
]

quality = [
    "ruff==0.16.0",
    "flake8==7.3.0",
    "flake8-cognitive-complexity==0.1.0",
    "cognitive-complexity==1.3.0",
    "pylint==4.0.6",
    "pre-commit==4.3.0",
]

doc = [
    "mkdocs (>=1.2.3,<2.0.0)",
    "mkdocs-autorefs (>=0.3.1,<2.0.0)",
    "mkdocs-include-markdown-plugin (>=3.2.3,<8.0.0)",
    "mkdocs-material (>=8.1.11,<10.0.0)",
    "mkdocs-material-extensions (>=1.0.3,<2.0.0)",
    "mkdocstrings (>=0.25.2,<2.0.0)",
    "mkdocstrings-python (>=0.9.0,<3.0.0)",
    "mike (>=1.1.2,<3.0.0)",
]

# Poetry 2.x group definitions — mirrors [dependency-groups] above for CI install
[tool.poetry.group.dev.dependencies]
mypy = "1.20.2"
pandas-stubs = "2.3.3.260113"
pyarrow-stubs = "20.0.0.20251215"
types-PyYAML = "6.0.12.20261103"
ruff = "0.16.0"
tox = ">=3.24.5,<4.0.0"
pre-commit = "4.3.0"
twine = ">=3.8.0,<4.0.0"
html2image = ">=2.0.7,<3.0.0"

[tool.poetry.group.test.dependencies]
freezegun = ">=1.5.5,<2.0.0"
pytest = ">=9.0.2,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-timeout = ">=2.4.0,<3.0.0"
pytest-socket = "0.7.0"

[tool.poetry.group.quality]
optional = true

[tool.poetry.group.quality.dependencies]
ruff = "0.16.0"
flake8 = "7.3.0"
flake8-cognitive-complexity = "0.1.0"
cognitive-complexity = "1.3.0"
pylint = "4.0.6"
pre-commit = "4.3.0"

[tool.poetry.group.doc.dependencies]
mkdocs = ">=1.2.3,<2.0.0"
mkdocs-autorefs = ">=0.3.1,<2.0.0"
mkdocs-include-markdown-plugin = ">=3.2.3,<8.0.0"
mkdocs-material = ">=8.1.11,<10.0.0"
mkdocs-material-extensions = ">=1.0.3,<2.0.0"
mkdocstrings = ">=0.25.2,<2.0.0"
mkdocstrings-python = ">=0.9.0,<3.0.0"
mike = ">=1.1.2,<3.0.0"

[tool.mypy]
files = ["quantide"]
cache_dir = "/tmp/millionaire-ce/mypy-cache"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
show_error_codes = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apscheduler", "apscheduler.*", "baostock", "baostock.*",
    "fasthtml", "fasthtml.*", "fastlite", "fastlite.*",
    "monsterui", "monsterui.*", "tushare", "tushare.*",
]
ignore_missing_imports = true

[tool.coverage.run]
data_file = "${COVERAGE_FILE-/tmp/millionaire-ce/coverage/.coverage}"
source = ["quantide"]
branch = true
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]
# uncomment the following to omit files during running
#omit =

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
    # Protocol / abstract method stubs whose body is exactly `...`
    # (Ellipsis). These statements are never executed at runtime —
    # they live inside the function body of a typing.Protocol and
    # therefore cannot be reached by any runtime call path.
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
]
