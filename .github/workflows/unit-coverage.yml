name: Unit coverage

on:
  push:
    branches: [main, releases/**]
  pull_request:
    branches: [main, releases/**]

jobs:
  unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        env:
          HOME: ${{ runner.temp }}/quantide-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/quantide-config
        run: pip install poetry && poetry install --with test --without doc
      - name: Run unit coverage gate
        env:
          HOME: ${{ runner.temp }}/quantide-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/quantide-config
          QUANTIDE_DATA_HOME: ${{ runner.temp }}/quantide-data
          COVERAGE_PROCESS_START: pyproject.toml
        # Enforces the early 95% guard; the strict classified gate runs below.
        # --timeout=60 caps each test at 60 seconds.
        run: >-
          poetry run pytest tests/unit --cov=quantide --cov-fail-under=95 --timeout=60 -o faulthandler_timeout=90
          --cov-report=term-missing --cov-report=json:coverage.json
          --cov-report=html:htmlcov
      - name: Check per-file coverage
        env:
          HOME: ${{ runner.temp }}/quantide-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/quantide-config
        run: >-
          poetry run python tests/unit/_checkers/per_file_coverage.py coverage.json
          .louke/project/specs/v0.2-004-coverage-recovery/coverage-waivers.json
          --inventory .louke/project/specs/v0.2-004-coverage-recovery/recovery/production-file-inventory.json
          --report per-file-coverage.json
      - name: Check source manifest
        run: >-
          poetry run python tests/unit/_checkers/source_manifest.py check
          --source quantide
          --inventory .louke/project/specs/v0.2-004-coverage-recovery/recovery/production-file-inventory.json
          --coverage coverage.json
          --report source-manifest.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: |
            coverage.json
            per-file-coverage.json
            source-manifest.json
            htmlcov/
          retention-days: 30
